name = "kissa-relay"
main = "src/index.js"
compatibility_date = "2025-06-01"
# Andrebellapro's account, which also owns wannabeguru.com, so the relay sends sign-in email itself.
account_id = "6646c9a4473bb8fd48897676e1849b3e"

# Secrets (set with `npx wrangler secret put <NAME>`, never committed): REDDIT_CLIENT_ID, REDDIT_CLIENT_SECRET

[vars]
SENDER = "Kissa <signin@wannabeguru.com>"
# Shown on the terms, privacy and account-deletion pages (src/pages.js).
CONTACT_EMAIL = "andrebellapro@gmail.com"
# Google Cloud "Web application" OAuth client ID for "Continue with Google"; empty turns Google sign-in off.
GOOGLE_CLIENT_ID = "98321916650-qe2ok27ie78hh0cpsmvaip0a1m1dabdd.apps.googleusercontent.com"

# Cloudflare Email Service. Sending to any address (not just verified ones) needs the Workers Paid plan.
[[send_email]]
name = "EMAIL"

# Accounts, liked cards, daily stats and Kissa stories (see src/account.js and src/stories.js). Schema changes go
# in migrations/ and are applied with `npx wrangler d1 migrations apply kissa --remote`.
[[d1_databases]]
binding = "DB"
database_name = "kissa"
database_id = "f7955df5-7005-46ee-836b-fefd441af778"
